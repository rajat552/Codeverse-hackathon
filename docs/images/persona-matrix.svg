<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="auto">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="280" rx="14" fill="url(#pBg)" stroke="#334155" stroke-width="1.2"/>

  <!-- Header -->
  <text x="35" y="38" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">1-CLICK DEMONSTRATION PERSONAS</text>
  <text x="35" y="64" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">Pre-Configured Stakeholder Roles (Built-in Testing)</text>

  <!-- 4 Persona Cards -->
  <!-- Persona 1 -->
  <g transform="translate(35, 85)">
    <rect width="240" height="165" rx="10" fill="url(#pCard)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="34" cy="34" r="18" fill="#0369a1"/>
    <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16">👤</text>
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Dr. Elena Rostova</text>
    <text x="64" y="48" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Requester / Researcher</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Department: Neuroscience</text>
    <text x="18" y="104" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Holds Laser Level 3 Badge.</text>
    <text x="18" y="122" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Discovers &amp; books high-end gear.</text>
    <rect x="18" y="132" width="204" height="20" rx="4" fill="#0c4a6e"/>
    <text x="50" y="146" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Active Allocations: 1/3</text>
  </g>

  <!-- Persona 2 -->
  <g transform="translate(295, 85)">
    <rect width="240" height="165" rx="10" fill="url(#pCard)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="34" cy="34" r="18" fill="#4338ca"/>
    <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16">🔧</text>
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Marcus Chen</text>
    <text x="64" y="48" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Equipment Owner / Tech</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Department: Fabrication Lab</text>
    <text x="18" y="104" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Lists 3D printers &amp; laser cutters.</text>
    <text x="18" y="122" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Sets blackout maintenance windows.</text>
    <rect x="18" y="132" width="204" height="20" rx="4" fill="#312e81"/>
    <text x="65" y="146" fill="#c7d2fe" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Managed Assets: 4</text>
  </g>

  <!-- Persona 3 -->
  <g transform="translate(555, 85)">
    <rect width="240" height="165" rx="10" fill="url(#pCard)" stroke="#34d399" stroke-width="1"/>
    <circle cx="34" cy="34" r="18" fill="#065f46"/>
    <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16">👩‍💼</text>
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Sarah Jenkins</text>
    <text x="64" y="48" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Lending Desk Manager</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Department: Central Equipment Desk</text>
    <text x="18" y="104" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Conducts physical checkouts.</text>
    <text x="18" y="122" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Inspects item returns &amp; damage logs.</text>
    <rect x="18" y="132" width="204" height="20" rx="4" fill="#064e3b"/>
    <text x="45" y="146" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Daily Checkouts: 12</text>
  </g>

  <!-- Persona 4 -->
  <g transform="translate(815, 85)">
    <rect width="250" height="165" rx="10" fill="url(#pCard)" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="34" cy="34" r="18" fill="#92400e"/>
    <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16">⚙️</text>
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Avery Vance</text>
    <text x="64" y="48" fill="#fcd34d" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">System Administrator</text>
    <text x="18" y="82" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="12">Department: Institutional Governance</text>
    <text x="18" y="104" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Configures global borrowing limits.</text>
    <text x="18" y="122" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Reviews immutable audit trail.</text>
    <rect x="18" y="132" width="214" height="20" rx="4" fill="#78350f"/>
    <text x="45" y="146" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Immutable Audit Access</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
  <path d="M 150 0 L 150 420 M 300 0 L 300 420 M 450 0 L 450 420 M 600 0 L 600 420 M 750 0 L 750 420 M 900 0 L 900 420 M 1050 0 L 1050 420" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Glowing background blobs -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Badge Pill -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="16" r="6" fill="#10b981"/>
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CODEVERSE HACKATHON PLATFORM</text>
  </g>

  <!-- Main Title -->
  <text x="60" y="135" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">EquipShare</text>
  <text x="360" y="135" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500">Enterprise Resource &amp; Equipment Lifecycle</text>

  <!-- Subtitle Prose -->
  <text x="60" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Unlocking underutilized university equipment, research laboratories, and institutional spaces.
  </text>
  <text x="60" y="208" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Enforcing mandatory safety eligibility, fair-allocation waitlists, guided handover audits &amp; cryptographic logs.
  </text>

  <!-- 4 Feature Metric Cards -->
  <g transform="translate(60, 250)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="24">🛡️</text>
    <text x="60" y="38" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Safety Eligibility</text>
    <text x="24" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Prerequisite license &amp; safety</text>
    <text x="24" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">training verification gate.</text>
    <rect x="24" y="98" width="80" height="4" rx="2" fill="#38bdf8"/>

    <!-- Card 2 -->
    <rect x="275" y="0" width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="299" y="38" fill="#818cf8" font-family="-apple-system, sans-serif" font-size="24">⚖️</text>
    <text x="335" y="38" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Fair Allocation</text>
    <text x="299" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Transparent queue with automated</text>
    <text x="299" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">priority waitlist promotion.</text>
    <rect x="299" y="98" width="80" height="4" rx="2" fill="#818cf8"/>

    <!-- Card 3 -->
    <rect x="550" y="0" width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="574" y="38" fill="#34d399" font-family="-apple-system, sans-serif" font-size="24">📋</text>
    <text x="610" y="38" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Custody Audit</text>
    <text x="574" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Checklist-guided handover &amp; return</text>
    <text x="574" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">condition verification.</text>
    <rect x="574" y="98" width="80" height="4" rx="2" fill="#34d399"/>

    <!-- Card 4 -->
    <rect x="825" y="0" width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="849" y="38" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="24">⚡</text>
    <text x="885" y="38" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Zero Dependencies</text>
    <text x="849" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Node.js 22 + SQLite WAL mode.</text>
    <text x="849" y="88" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">Self-contained &amp; instant setup.</text>
    <rect x="849" y="98" width="80" height="4" rx="2" fill="#f59e0b"/>
  </g>
</svg>


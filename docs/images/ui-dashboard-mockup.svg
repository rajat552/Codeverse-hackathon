<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="auto">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Window Container -->
  <rect width="1100" height="680" rx="14" fill="url(#appBg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Top Bar (macOS style) -->
  <path d="M 0 14 C 0 6 6 0 14 0 L 1086 0 C 1094 0 1100 6 1100 14 L 1100 48 L 0 48 Z" fill="#1e293b"/>
  <circle cx="28" cy="24" r="6" fill="#ef4444"/>
  <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="24" r="6" fill="#10b981"/>
  <text x="100" y="29" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">EquipShare Application • http://localhost:3000</text>

  <!-- App Header / Persona Switcher Bar -->
  <g transform="translate(0, 48)">
    <rect width="1100" height="72" fill="url(#headerGrad)" stroke="#334155" stroke-width="0.8"/>
    
    <!-- Logo -->
    <rect x="28" y="18" width="36" height="36" rx="8" fill="#3b82f6"/>
    <text x="38" y="42" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20">⚡</text>
    <text x="74" y="42" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">EquipShare</text>

    <!-- Persona Switcher Pill -->
    <g transform="translate(680, 16)">
      <rect width="390" height="40" rx="20" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <!-- Active Pill: Requester -->
      <rect x="4" y="4" width="110" height="32" rx="16" fill="#2563eb"/>
      <text x="16" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">👤 Dr. Elena</text>
      <!-- Other Roles -->
      <text x="126" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">🔧 Marcus</text>
      <text x="214" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">👩‍💼 Sarah</text>
      <text x="300" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">⚙️ Avery</text>
    </g>
  </g>

  <!-- Navigation Tabs -->
  <g transform="translate(28, 140)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#1e293b"/>
    <text x="18" y="21" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">🔍 Catalog</text>

    <text x="125" y="21" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">📅 My Bookings</text>
    <text x="245" y="21" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">🏢 Department Desk</text>
    <text x="395" y="21" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13">📜 Handover Audit Log</text>

    <!-- Search & Filter Controls -->
    <rect x="740" y="-4" width="300" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="756" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13">🔎 Filter by department or category...</text>
  </g>

  <!-- Resource Grid (3 Columns) -->
  <g transform="translate(28, 195)">
    <!-- Card 1: Confocal Laser Microscope -->
    <rect x="0" y="0" width="326" height="440" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Image Header Area -->
    <rect x="1" y="1" width="324" height="150" rx="11" fill="#1e293b"/>
    <text x="135" y="85" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="44">🔬</text>
    <rect x="16" y="16" width="90" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="26" y="32" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● AVAILABLE</text>
    
    <!-- Card Body -->
    <text x="18" y="185" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">Zeiss LSM 980 Microscope</text>
    <text x="18" y="208" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Department: Advanced Imaging Facility</text>
    <text x="18" y="235" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">High-resolution spectral confocal imaging for live cellular research.</text>
    
    <!-- Verification Requirement Badge -->
    <rect x="18" y="260" width="220" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
    <text x="28" y="277" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🔒 Laser Safety Level 3 Required</text>

    <!-- Custody Checklist Meta -->
    <text x="18" y="315" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Max Booking: 3 days • Penalty: $50/day late</text>
    <text x="18" y="335" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Handover Checklist: 4 items (Lens, Laser key...)</text>

    <!-- Button -->
    <rect x="18" y="370" width="290" height="42" rx="8" fill="url(#btnGrad)"/>
    <text x="110" y="396" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Request Booking</text>

    <!-- Card 2: Industrial 3D SLA Printer -->
    <rect x="358" y="0" width="326" height="440" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="359" y="1" width="324" height="150" rx="11" fill="#1e293b"/>
    <text x="495" y="85" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="44">🖨️</text>
    <rect x="374" y="16" width="94" height="24" rx="12" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
    <text x="384" y="32" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● IN USE (Waitlist)</text>

    <text x="376" y="185" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">Formlabs Form 4L SLA</text>
    <text x="376" y="208" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Department: Fabrication Laboratory</text>
    <text x="376" y="235" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Large-format stereolithography 3D printer for architectural models.</text>

    <rect x="376" y="260" width="200" height="26" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="0.8"/>
    <text x="386" y="277" fill="#d6d3d1" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🔒 Lab Safety Induction</text>

    <text x="376" y="315" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Queue: 1 Researcher Ahead (Fair-use)</text>
    <text x="376" y="335" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Next Estimated Available: Tomorrow, 2:00 PM</text>

    <rect x="376" y="370" width="290" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="460" y="396" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Join Fair Waitlist</text>

    <!-- Card 3: 8K Cinema Camera Rig -->
    <rect x="716" y="0" width="326" height="440" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <rect x="717" y="1" width="324" height="150" rx="11" fill="#1e293b"/>
    <text x="850" y="85" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="44">🎥</text>
    <rect x="732" y="16" width="90" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
    <text x="742" y="32" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● AVAILABLE</text>

    <text x="734" y="185" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">RED V-Raptor 8K VV Rig</text>
    <text x="734" y="208" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Department: Film &amp; Media Production</text>
    <text x="734" y="235" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Cinema camera kit with carbon fiber cage, anamorphic prime lenses.</text>

    <rect x="734" y="260" width="210" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
    <text x="744" y="277" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="500">🔒 Advanced Cinematography Cert</text>

    <text x="734" y="315" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Inventory Code: RED-8K-002 • Pool A</text>
    <text x="734" y="335" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Audit Protocol: 6-point Optical Checklist</text>

    <rect x="734" y="370" width="290" height="42" rx="8" fill="url(#btnGrad)"/>
    <text x="825" y="396" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Request Booking</text>
  </g>
</svg>

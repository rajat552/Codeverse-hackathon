<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow • Modern Todo & Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo-icon">
          <i class="fa-solid fa-check-double"></i>
        </div>
        <div>
          <h1 class="app-title">TaskFlow</h1>
          <p class="app-subtitle" id="currentDate">Stay organized & productive</p>
        </div>
      </div>
      <div class="header-right">
        <button id="themeToggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle theme">
          <i class="fa-solid fa-sun" id="themeIcon"></i>
        </button>
      </div>
    </header>

    <!-- Stats & Progress Card -->
    <section class="stats-card">
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-number" id="totalTasksCount">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number text-pending" id="pendingTasksCount">0</span>
          <span class="stat-label">In Progress</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <span class="stat-number text-completed" id="completedTasksCount">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress-info">
          <span>Overall Progress</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Task Creator Card -->
    <section class="creator-card">
      <form id="taskForm" class="task-form">
        <div class="form-row main-input-row">
          <div class="input-with-icon">
            <i class="fa-solid fa-pen"></i>
            <input 
              type="text" 
              id="taskInput" 
              placeholder="What needs to be done? (e.g., Complete project presentation)" 
              required
              autocomplete="off"
            />
          </div>
          <button type="submit" class="primary-btn" id="submitTaskBtn">
            <i class="fa-solid fa-plus"></i>
            <span>Add Task</span>
          </button>
        </div>

        <div class="form-row options-row">
          <div class="option-field">
            <label for="taskCategory"><i class="fa-solid fa-folder-open"></i> Category</label>
            <select id="taskCategory">
              <option value="Work">💼 Work</option>
              <option value="Personal">🏡 Personal</option>
              <option value="Study">📚 Study</option>
              <option value="Health">💪 Health</option>
              <option value="Finance">💰 Finance</option>
              <option value="Other">✨ Other</option>
            </select>
          </div>

          <div class="option-field">
            <label for="taskPriority"><i class="fa-solid fa-flag"></i> Priority</label>
            <select id="taskPriority">
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>

          <div class="option-field">
            <label for="taskDueDate"><i class="fa-solid fa-calendar"></i> Due Date</label>
            <input type="date" id="taskDueDate" />
          </div>
        </div>
      </form>
    </section>

    <!-- Filter & Search Controls -->
    <section class="controls-card">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search tasks..." />
        <button id="clearSearchBtn" class="clear-btn hidden" title="Clear search">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="filter-group">
        <!-- Status Filters -->
        <div class="tabs" id="statusTabs">
          <button class="tab-btn active" data-status="all">All</button>
          <button class="tab-btn" data-status="active">Active</button>
          <button class="tab-btn" data-status="completed">Done</button>
        </div>

        <!-- Secondary Filters -->
        <div class="dropdown-filters">
          <select id="categoryFilter" aria-label="Filter by category">
            <option value="all">All Categories</option>
            <option value="Work">💼 Work</option>
            <option value="Personal">🏡 Personal</option>
            <option value="Study">📚 Study</option>
            <option value="Health">💪 Health</option>
            <option value="Finance">💰 Finance</option>
            <option value="Other">✨ Other</option>
          </select>

          <select id="priorityFilter" aria-label="Filter by priority">
            <option value="all">All Priorities</option>
            <option value="high">🔴 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>

          <select id="sortBy" aria-label="Sort tasks">
            <option value="dateAddedDesc">Newest First</option>
            <option value="dateAddedAsc">Oldest First</option>
            <option value="dueDateAsc">Due Date (Soonest)</option>
            <option value="priorityDesc">Priority (High to Low)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Quick Actions Bar -->
    <div class="quick-actions-bar">
      <span class="active-count-text" id="filteredCount">Showing 0 tasks</span>
      <div class="bulk-actions">
        <button id="markAllBtn" class="subtle-btn" title="Toggle all tasks completion">
          <i class="fa-solid fa-check"></i> Complete All
        </button>
        <button id="clearCompletedBtn" class="subtle-btn danger" title="Clear completed tasks">
          <i class="fa-solid fa-trash-can"></i> Clear Completed
        </button>
      </div>
    </div>

    <!-- Task List -->
    <main class="task-list-container">
      <ul id="taskList" class="task-list">
        <!-- Dynamic Tasks Injected Here -->
      </ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">
          <i class="fa-solid fa-clipboard-check"></i>
        </div>
        <h3 id="emptyTitle">No tasks found</h3>
        <p id="emptyDescription">You have no tasks matching this filter. Relax or add a new task!</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Built with ❤️ for <strong>Codeverse Hackathon</strong> • Stores data locally in your browser</p>
    </footer>
  </div>

  <!-- Edit Task Modal -->
  <div id="editModal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fa-solid fa-pen-to-square"></i> Edit Task</h3>
        <button id="closeModalBtn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="editTaskForm">
        <input type="hidden" id="editTaskId" />
        <div class="form-group">
          <label for="editTaskTitle">Task Description</label>
          <input type="text" id="editTaskTitle" required />
        </div>
        <div class="form-row modal-row">
          <div class="form-group">
            <label for="editTaskCategory">Category</label>
            <select id="editTaskCategory">
              <option value="Work">💼 Work</option>
              <option value="Personal">🏡 Personal</option>
              <option value="Study">📚 Study</option>
              <option value="Health">💪 Health</option>
              <option value="Finance">💰 Finance</option>
              <option value="Other">✨ Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editTaskPriority">Priority</label>
            <select id="editTaskPriority">
              <option value="high">🔴 High</option>
              <option value="medium">🟡 Medium</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="editTaskDueDate">Due Date</label>
          <input type="date" id="editTaskDueDate" />
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelEditBtn" class="subtle-btn">Cancel</button>
          <button type="submit" class="primary-btn">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast hidden">
    <span id="toastMessage"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
